# Gitleaks Configuration for VitalQ Enterprise SDLC
[extend]
useDefault = true

[allowlist]
description = "Allowlist test fixture passwords, mocks, and seed data"
paths = [
  '''api/VitalQ\.Tests/.*''',
  '''web/src/.*\.spec\.ts''',
  '''vitalq_cloud_seed\.sql''',
  '''api/VitalQ\.DataAccess/DbInitializer\.cs'''
]
