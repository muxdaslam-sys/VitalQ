version: 2
updates:
  # 1. NuGet (.NET 8 Web API & Test Suite)
  # Disabled automatic PR creation (limit: 0) to prevent LTS breakage; alerts remain monitored in Security tab.
  - package-ecosystem: "nuget"
    directory: "/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps-nuget)"
    groups:
      dotnet-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Preserve .NET 8 LTS: never auto-bump major package versions
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # 2. npm (Angular 19 SPA)
  # Disabled automatic PR creation (limit: 0) to prevent peer-dependency lockfile breaks; alerts remain in Security tab.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps-npm)"
    groups:
      angular-and-web-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Preserve Angular 19 LTS: never auto-bump major package versions or TypeScript minor versions
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-minor"]

  # 3. GitHub Actions Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
