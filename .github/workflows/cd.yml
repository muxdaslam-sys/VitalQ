name: VitalQ CD - Production Deployment to Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # =========================================================================
  # 1. PRE-DEPLOYMENT QUALITY GATE: Enforce tests before Azure deployment
  # =========================================================================
  verify-build-and-tests:
    name: Pre-Deployment Build & Test Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and Build .NET Solution
        run: |
          dotnet restore api/VitalQ.sln
          dotnet build api/VitalQ.sln --configuration Release --no-restore --warnaserror

      - name: Run Backend Tests (76 Tests)
        run: dotnet test api/VitalQ.Tests/VitalQ.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Install dotnet-ef CLI Tool (.NET 8)
        run: dotnet tool install --global dotnet-ef --version 8.0.10 || dotnet tool update --global dotnet-ef --version 8.0.10

      - name: Validate Idempotent Database Migration Script
        run: |
          dotnet ef migrations script --idempotent \
            --project api/VitalQ.DataAccess/VitalQ.DataAccess.csproj \
            --startup-project api/VitalQ.API/VitalQ.API.csproj \
            --output api/migrations.sql
          test -s api/migrations.sql

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies & Run Tests (21 Tests)
        run: |
          npm --prefix web ci
          npm --prefix web test -- --watch=false --browsers=ChromeHeadlessNoSandbox
          npm --prefix web run build

  # =========================================================================
  # 2. PRODUCTION DEPLOYMENT: Gated strictly on pre-deployment tests passing
  # =========================================================================
  deploy-production:
    name: Deploy to Azure Container Apps
    needs: [verify-build-and-tests]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ca-vitalq-web.politeisland-88851c55.centralindia.azurecontainerapps.io

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to Azure Cloud
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Authenticate Docker with Azure Container Registry
        run: |
          az acr login --name crvitalqprod

      - name: Deploy Infrastructure as Code (Azure Bicep)
        run: |
          echo "Deploying and verifying declarative Azure Bicep infrastructure..."
          az deployment group create \
            --name "vitalq-cd-${{ github.sha }}" \
            --resource-group rg-vitalq-prod-centralindia \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json \
            --parameters sqlAdministratorLogin="${{ secrets.SQL_ADMIN_USERNAME }}" \
            --parameters sqlAdministratorLoginPassword="${{ secrets.SQL_ADMIN_PASSWORD }}"

      - name: Build and Push Backend Container Image (.NET 8)
        run: |
          docker build -f api/VitalQ.API/Dockerfile \
            -t crvitalqprod.azurecr.io/vitalq-api:${{ github.sha }} \
            -t crvitalqprod.azurecr.io/vitalq-api:latest ./api
          docker push crvitalqprod.azurecr.io/vitalq-api:${{ github.sha }}
          docker push crvitalqprod.azurecr.io/vitalq-api:latest

      - name: Build and Push Frontend Container Image (Angular 19)
        run: |
          docker build -f web/Dockerfile \
            -t crvitalqprod.azurecr.io/vitalq-web:${{ github.sha }} \
            -t crvitalqprod.azurecr.io/vitalq-web:latest ./web
          docker push crvitalqprod.azurecr.io/vitalq-web:${{ github.sha }}
          docker push crvitalqprod.azurecr.io/vitalq-web:latest

      - name: Configure Container Apps Registry Credentials
        run: |
          echo "Configuring private ACR credentials for Azure Container Apps..."
          ACR_USERNAME=$(az acr credential show --name crvitalqprod --query username -o tsv)
          ACR_PASSWORD=$(az acr credential show --name crvitalqprod --query "passwords[0].value" -o tsv)

          az containerapp registry set \
            --name ca-vitalq-api \
            --resource-group rg-vitalq-prod-centralindia \
            --server crvitalqprod.azurecr.io \
            --username "$ACR_USERNAME" \
            --password "$ACR_PASSWORD"

          az containerapp registry set \
            --name ca-vitalq-web \
            --resource-group rg-vitalq-prod-centralindia \
            --server crvitalqprod.azurecr.io \
            --username "$ACR_USERNAME" \
            --password "$ACR_PASSWORD"

      - name: Deploy Backend Revision to Azure Container Apps
        id: deploy-backend
        run: |
          REV_SUFFIX="rel-$(echo "${{ github.sha }}" | cut -c1-7)"
          echo "Deploying backend revision suffix: $REV_SUFFIX..."
          az containerapp update \
            --name ca-vitalq-api \
            --resource-group rg-vitalq-prod-centralindia \
            --image crvitalqprod.azurecr.io/vitalq-api:${{ github.sha }} \
            --revision-suffix "$REV_SUFFIX"

      - name: Deploy Frontend Revision to Azure Container Apps
        id: deploy-frontend
        run: |
          REV_SUFFIX="rel-$(echo "${{ github.sha }}" | cut -c1-7)"
          echo "Deploying frontend revision suffix: $REV_SUFFIX..."
          az containerapp update \
            --name ca-vitalq-web \
            --resource-group rg-vitalq-prod-centralindia \
            --image crvitalqprod.azurecr.io/vitalq-web:${{ github.sha }} \
            --set-env-vars BACKEND_URL=https://ca-vitalq-api.politeisland-88851c55.centralindia.azurecontainerapps.io \
            --revision-suffix "$REV_SUFFIX"

      - name: Automated Synthetic Smoke Testing with Auto-Rollback Guard
        run: |
          echo "Initiating automated post-deployment synthetic smoke tests..."

          FAILED_COUNT=0

          probe_endpoint() {
            local url="$1"
            local expected="$2"
            local name="$3"
            local max_retries=15
            local delay=5

            echo "--------------------------------------------------------"
            echo "Probing: $name"
            echo "URL: $url"

            for i in $(seq 1 $max_retries); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 "$url" || echo "000")
              if [ "$STATUS" = "$expected" ]; then
                echo "SUCCESS: $name responded with HTTP $STATUS on attempt $i."
                return 0
              fi
              echo "Attempt $i/$max_retries: Received HTTP $STATUS. Waiting ${delay}s for container/database warmup..."
              sleep $delay
            done

            echo "ERROR: $name probe failed after $max_retries attempts. Last status: HTTP $STATUS."
            FAILED_COUNT=$((FAILED_COUNT + 1))
            return 1
          }

          # 1. API Readiness Probe (Validates Kestrel + SQL Server DatabaseHealthCheck)
          probe_endpoint "https://ca-vitalq-api.politeisland-88851c55.centralindia.azurecontainerapps.io/health" "200" "API & Database Readiness" || true

          # 2. Public API Query (Validates Controller -> Service -> Redis Cache -> SQL Data)
          probe_endpoint "https://ca-vitalq-api.politeisland-88851c55.centralindia.azurecontainerapps.io/api/public/departments" "200" "Public Departments (SQL + Redis)" || true

          # 3. Frontend Web Client (Validates Nginx Alpine & Angular 19 SPA)
          probe_endpoint "https://ca-vitalq-web.politeisland-88851c55.centralindia.azurecontainerapps.io/" "200" "Frontend Web Client" || true

          # Automated Rollback Guard: Revert traffic to previous revision if any probe failed
          if [ $FAILED_COUNT -ne 0 ]; then
            echo "CRITICAL: $FAILED_COUNT health checks failed! Initiating automated zero-downtime rollback..."
            PREV_REV=$(az containerapp revision list --name ca-vitalq-api --resource-group rg-vitalq-prod-centralindia --query "[?properties.active].name" -o tsv | tail -n 2 | head -n 1)
            if [ -n "$PREV_REV" ]; then
              echo "Activating previous stable API revision: $PREV_REV..."
              az containerapp revision activate --name ca-vitalq-api --resource-group rg-vitalq-prod-centralindia --revision "$PREV_REV"
            fi
            exit 1
          fi

          echo "All synthetic smoke tests passed successfully. Production release verified."

      - name: Generate Deployment Summary
        if: always()
        run: |
          echo "### Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status | Live Endpoint |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Web Client** | Deployed | [ca-vitalq-web](https://ca-vitalq-web.politeisland-88851c55.centralindia.azurecontainerapps.io) |" >> $GITHUB_STEP_SUMMARY
          echo "| **API Service** | Deployed | [ca-vitalq-api](https://ca-vitalq-api.politeisland-88851c55.centralindia.azurecontainerapps.io) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image Tag** | \`${{ github.sha }}\` | \`crvitalqprod.azurecr.io\` |" >> $GITHUB_STEP_SUMMARY
