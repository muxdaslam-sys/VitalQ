name: VitalQ CI - Pull Request & Branch Quality Gate

on:
  push:
    branches: [ "feat/**", "fix/**", "perf/**" ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. BACKEND CI: .NET 8 Build & 53 Automated xUnit Tests
  # =========================================================================
  backend-ci:
    name: Backend Build (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Hardcoded Secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Dependencies
        run: dotnet restore api/VitalQ.sln

      - name: Build Solution (Release with Zero Warnings)
        run: dotnet build api/VitalQ.sln --configuration Release --no-restore --warnaserror

      - name: Run Backend Tests with Code Coverage (76 xUnit & Integration Tests)
        run: dotnet test api/VitalQ.Tests/VitalQ.Tests.csproj --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Upload Backend Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage/**/coverage.cobertura.xml

      - name: Install dotnet-ef CLI Tool (.NET 8)
        run: dotnet tool install --global dotnet-ef --version 8.0.10 || dotnet tool update --global dotnet-ef --version 8.0.10

      - name: Validate Idempotent Database Migration Script
        run: |
          dotnet ef migrations script --idempotent \
            --project api/VitalQ.DataAccess/VitalQ.DataAccess.csproj \
            --startup-project api/VitalQ.API/VitalQ.API.csproj \
            --output api/migrations.sql
          test -s api/migrations.sql
          echo "Idempotent database migration script validated successfully."

  # =========================================================================
  # 2. FRONTEND CI: Angular 19 Build & 13 Headless Jasmine Tests
  # =========================================================================
  frontend-ci:
    name: Frontend Build (Angular 19)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        run: npm --prefix web ci

      - name: Run Frontend Tests with Code Coverage (21 Jasmine Tests)
        run: npm --prefix web test -- --watch=false --browsers=ChromeHeadlessNoSandbox --code-coverage

      - name: Upload Frontend Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: web/coverage/vitalq-web/lcov.info

      - name: Build Angular Application (Release)
        run: npm --prefix web run build

  # =========================================================================
  # 3. DOCKER CI & TRIVY SECURITY SCAN: Multi-Stage Image & Vulnerability Audit
  # =========================================================================
  docker-ci:
    name: Verify Docker Container Builds & Security Scan
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image (.NET 8 Chiseled)
        run: |
          docker build -f api/VitalQ.API/Dockerfile \
            -t vitalq-api:${{ github.sha }} ./api

      - name: Scan Backend Container for Vulnerabilities (Aquasec Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: vitalq-api:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build Frontend Docker Image (Angular 19 + Nginx Alpine)
        run: |
          docker build -f web/Dockerfile \
            -t vitalq-web:${{ github.sha }} ./web

      - name: Scan Frontend Container for Vulnerabilities (Aquasec Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: vitalq-web:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # =========================================================================
  # 4. INFRASTRUCTURE CI: Azure Bicep Template Validation Gate
  # =========================================================================
  bicep-ci:
    name: Validate Azure Bicep IaC Templates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Azure Bicep CLI
        run: az bicep install

      - name: Compile and Validate Bicep Architecture
        run: az bicep build --file infra/main.bicep

  # =========================================================================
  # 5. CODE COVERAGE GATE: Quality Gate & Coverage Scorecard (Coverlet & Lcov)
  # =========================================================================
  coverage-gate:
    name: Code Coverage Quality Gate
    needs: [backend-ci, frontend-ci, docker-ci, bicep-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Backend Coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: coverage/backend

      - name: Download Frontend Coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/frontend

      - name: Generate Code Coverage Summary Report
        uses: danielpalme/ReportGenerator-GitHub-Action@5.3.11
        with:
          reports: 'coverage/backend/**/coverage.cobertura.xml;coverage/frontend/lcov.info'
          targetdir: 'coverage/report'
          reporttypes: 'MarkdownSummaryGithub;Badges;Cobertura'

      - name: Publish Coverage Scorecard to GitHub Step Summary
        run: |
          if [ -f "coverage/report/SummaryGithub.md" ]; then
            cat coverage/report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Verify Coverage Artifacts Integrity
        run: |
          ls -la coverage/report
          echo "Coverage gate verification completed successfully."
