name: VitalQ CI - Test & Docker Build Verification

on:
  push:
    branches: [ main, "perf/*", "fix/*", "feat/*" ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Run Automated Tests & Verify Docker Builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Backend Tests (50 xUnit Tests)
        run: dotnet test api/VitalQ.Tests/VitalQ.Tests.csproj --configuration Release

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        run: npm --prefix web ci

      - name: Run Frontend Tests (13 Jasmine Tests)
        run: npm --prefix web test -- --watch=false --browsers=ChromeHeadlessNoSandbox

      - name: Build Backend Docker Image
        run: |
          docker build -f api/VitalQ.API/Dockerfile \
            -t vitalq-api:${{ github.sha }} \
            -t vitalq-api:latest ./api

      - name: Build Frontend Docker Image
        run: |
          docker build -f web/Dockerfile \
            -t vitalq-web:${{ github.sha }} \
            -t vitalq-web:latest ./web
