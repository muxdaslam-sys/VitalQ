name: VitalQ CI - Test & Docker Build Verification

on:
  push:
    branches: [ main, "perf/**", "fix/**", "feat/**" ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. BACKEND CI: .NET 8 Build & 51 Automated xUnit Tests
  # =========================================================================
  backend-ci:
    name: Backend Build (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Dependencies
        run: dotnet restore api/VitalQ.sln

      - name: Build Solution (Release)
        run: dotnet build api/VitalQ.sln --configuration Release --no-restore

      - name: Run Backend Tests (51 xUnit Tests)
        run: dotnet test api/VitalQ.Tests/VitalQ.Tests.csproj --configuration Release --no-build

  # =========================================================================
  # 2. FRONTEND CI: Angular 19 Build & 13 Headless Jasmine Tests
  # =========================================================================
  frontend-ci:
    name: Frontend Build (Angular 19)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        run: npm --prefix web ci

      - name: Run Frontend Tests (13 Jasmine Tests)
        run: npm --prefix web test -- --watch=false --browsers=ChromeHeadlessNoSandbox

      - name: Build Angular Application (Release)
        run: npm --prefix web run build

  # =========================================================================
  # 3. DOCKER CI: Multi-Stage Production Container Image Verification
  # =========================================================================
  docker-ci:
    name: Verify Docker Container Builds
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image (.NET 8 Chiseled)
        run: |
          docker build -f api/VitalQ.API/Dockerfile \
            -t vitalq-api:${{ github.sha }} \
            -t vitalq-api:latest ./api

      - name: Build Frontend Docker Image (Angular 19 + Nginx)
        run: |
          docker build -f web/Dockerfile \
            -t vitalq-web:${{ github.sha }} \
            -t vitalq-web:latest ./web

  # =========================================================================
  # 4. CONTINUOUS DEPLOYMENT (CD): Deploy to Azure Container Apps (On Merge to Main)
  # =========================================================================
  deploy-production:
    name: Deploy to Azure Container Apps
    needs: [backend-ci, frontend-ci, docker-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Authenticate Docker with Azure Container Registry
        run: |
          az acr login --name crvitalqprod

      - name: Build and Push Backend Container Image
        run: |
          docker build -f api/VitalQ.API/Dockerfile \
            -t crvitalqprod.azurecr.io/vitalq-api:${{ github.sha }} \
            -t crvitalqprod.azurecr.io/vitalq-api:latest ./api
          docker push crvitalqprod.azurecr.io/vitalq-api:${{ github.sha }}
          docker push crvitalqprod.azurecr.io/vitalq-api:latest

      - name: Build and Push Frontend Container Image
        run: |
          docker build -f web/Dockerfile \
            -t crvitalqprod.azurecr.io/vitalq-web:${{ github.sha }} \
            -t crvitalqprod.azurecr.io/vitalq-web:latest ./web
          docker push crvitalqprod.azurecr.io/vitalq-web:${{ github.sha }}
          docker push crvitalqprod.azurecr.io/vitalq-web:latest

      - name: Deploy Backend Revision to Azure Container Apps
        run: |
          az containerapp update \
            --name ca-vitalq-api \
            --resource-group rg-vitalq-prod-centralindia \
            --image crvitalqprod.azurecr.io/vitalq-api:${{ github.sha }}

      - name: Deploy Frontend Revision to Azure Container Apps
        run: |
          az containerapp update \
            --name ca-vitalq-web \
            --resource-group rg-vitalq-prod-centralindia \
            --image crvitalqprod.azurecr.io/vitalq-web:${{ github.sha }} \
            --set-env-vars BACKEND_URL=https://ca-vitalq-api.politeisland-88851c55.centralindia.azurecontainerapps.io

      - name: Verify Live Production Health Probe
        run: |
          sleep 15
          curl -f -I "https://ca-vitalq-api.politeisland-88851c55.centralindia.azurecontainerapps.io/health/live"
          curl -f -I "https://ca-vitalq-web.politeisland-88851c55.centralindia.azurecontainerapps.io/"
