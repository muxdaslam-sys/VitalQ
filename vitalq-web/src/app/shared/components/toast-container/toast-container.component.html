<div class="fixed top-5 right-5 z-[9999] flex flex-col gap-2.5 max-w-sm w-full pointer-events-none px-4 sm:px-0">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="pointer-events-auto flex items-start gap-3 p-4 rounded-2xl shadow-xl border backdrop-blur-md transition-all duration-300 transform translate-y-0"
         [ngClass]="{
           'bg-emerald-950/90 text-emerald-100 border-emerald-700/60 shadow-emerald-950/40': toast.type === 'success',
           'bg-rose-950/90 text-rose-100 border-rose-700/60 shadow-rose-950/40': toast.type === 'error',
           'bg-amber-950/90 text-amber-100 border-amber-700/60 shadow-amber-950/40': toast.type === 'warning',
           'bg-slate-900/95 text-slate-100 border-slate-700 shadow-slate-950/40': toast.type === 'info'
         }">
      <div class="shrink-0 mt-0.5">
        @if (toast.type === 'success') {
          <div class="w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xs font-bold border border-emerald-500/30">✓</div>
        } @else if (toast.type === 'error') {
          <div class="w-6 h-6 rounded-full bg-rose-500/20 text-rose-400 flex items-center justify-center text-xs font-bold border border-rose-500/30">✕</div>
        } @else if (toast.type === 'warning') {
          <div class="w-6 h-6 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center text-xs font-bold border border-amber-500/30">!</div>
        } @else {
          <div class="w-6 h-6 rounded-full bg-cyan-500/20 text-cyan-400 flex items-center justify-center text-xs font-bold border border-cyan-500/30">ℹ</div>
        }
      </div>
      <div class="flex-1 text-xs">
        @if (toast.title) {
          <p class="font-bold tracking-tight text-white mb-0.5">{{ toast.title }}</p>
        }
        <p class="leading-relaxed opacity-90">{{ toast.message }}</p>
      </div>
      <button (click)="toastService.remove(toast.id)" title="Dismiss Notification" class="shrink-0 text-white/50 hover:text-white p-1 rounded-lg hover:bg-white/10 transition">
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  }
</div>
