server {
    listen 80;
    server_name localhost;

    # DNS resolvers: Azure VNet DNS, Google Public DNS, Docker internal DNS
    resolver 168.63.129.16 8.8.8.8 127.0.0.11 valid=10s ipv6=off;

    # 1. Serve Angular 19 static production build
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse proxy health checks to backend
    location /health {
        set $backend "__BACKEND_URL__";
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
    }

    # 3. Reverse proxy REST API calls to the backend
    location /api/ {
        set $backend "__BACKEND_URL__";
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Reverse proxy SignalR WebSockets
    location /hubs/ {
        set $backend "__BACKEND_URL__";
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
