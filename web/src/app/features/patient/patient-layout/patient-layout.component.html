<div class="min-h-screen bg-slate-50/70 flex flex-col font-sans text-slate-800">
  <!-- Global In-App Floating Toast Alert Container -->
  <app-toast-container></app-toast-container>

  <!-- Top Responsive Header Navigation Bar -->
  <header class="bg-white border-b border-slate-200/80 sticky top-0 z-40 shadow-xs">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      
      <!-- Brand Logo & Badge -->
      <div class="flex items-center gap-6">
        <a routerLink="/patient" class="flex items-center gap-2.5 group">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-teal-500 to-teal-700 flex items-center justify-center text-white font-black text-lg shadow-sm shadow-teal-600/20 group-hover:scale-105 transition">
            V
          </div>
          <div>
            <h1 class="text-base font-black text-slate-900 tracking-tight leading-none">VitalQ</h1>
            <span class="text-[10px] text-teal-600 font-extrabold uppercase tracking-wider">Patient Portal</span>
          </div>
        </a>

        <!-- Desktop Navigation Tabs (Clean Direct Routes) -->
        <nav class="hidden md:flex items-center gap-1.5 ml-2">
          <a routerLink="/patient" 
             routerLinkActive="bg-teal-50 text-teal-800 font-bold border-teal-200/80 shadow-xs" 
             [routerLinkActiveOptions]="{ exact: true }"
             class="px-3.5 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-900 hover:bg-slate-100/80 border border-transparent transition flex items-center gap-2">
            <svg class="w-4 h-4 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z" />
            </svg>
            <span>My Tokens</span>
          </a>
          <a routerLink="/patient/book" 
             routerLinkActive="bg-teal-50 text-teal-800 font-bold border-teal-200/80 shadow-xs"
             class="px-3.5 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-900 hover:bg-slate-100/80 border border-transparent transition flex items-center gap-2">
            <svg class="w-4 h-4 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <span>Book Appointment</span>
          </a>
          <a routerLink="/patient/family" 
             routerLinkActive="bg-teal-50 text-teal-800 font-bold border-teal-200/80 shadow-xs"
             class="px-3.5 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-900 hover:bg-slate-100/80 border border-transparent transition flex items-center gap-2">
            <svg class="w-4 h-4 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
            <span>Family Members</span>
          </a>
          <a routerLink="/patient/history" 
             routerLinkActive="bg-teal-50 text-teal-800 font-bold border-teal-200/80 shadow-xs"
             class="px-3.5 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-900 hover:bg-slate-100/80 border border-transparent transition flex items-center gap-2">
            <svg class="w-4 h-4 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <span>Visit History</span>
          </a>
        </nav>
      </div>

      <!-- User Profile & Dropdown Popover -->
      <div class="relative">
        <button (click)="toggleDropdown()"
                class="flex items-center gap-2.5 bg-slate-50 hover:bg-slate-100/90 border border-slate-200/90 py-1.5 px-2.5 rounded-2xl transition cursor-pointer shadow-xs group">
          <div class="w-8 h-8 rounded-xl bg-teal-600 group-hover:bg-teal-700 text-white font-extrabold text-xs flex items-center justify-center shadow-xs transition">
            {{ getUserInitials() }}
          </div>
          <div class="text-left hidden sm:block pr-1">
            <p class="text-xs font-bold text-slate-900 leading-tight">{{ auth.currentUser()?.fullName || 'Patient' }}</p>
            <span class="text-[10px] text-slate-400 font-semibold">{{ auth.currentUser()?.role || 'Patient' }}</span>
          </div>
          <svg class="w-3.5 h-3.5 text-slate-400 group-hover:text-slate-600 transition ml-0.5" 
               [class.rotate-180]="isDropdownOpen()"
               fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </button>

        <!-- Dropdown Menu -->
        @if (isDropdownOpen()) {
          <div class="absolute right-0 mt-2 w-56 bg-white rounded-2xl border border-slate-200 shadow-xl py-2 z-50 animate-in fade-in slide-in-from-top-2 duration-150">
            <!-- User summary header -->
            <div class="px-4 py-2 border-b border-slate-100">
              <p class="text-xs font-black text-slate-900 truncate">{{ auth.currentUser()?.fullName || 'Patient' }}</p>
              <p class="text-[11px] text-slate-500 font-mono mt-0.5 truncate">{{ auth.currentUser()?.username || 'Verified Account' }}</p>
            </div>

            <!-- Menu actions -->
            <div class="p-1.5">
              <a routerLink="/patient/family" 
                 (click)="closeDropdown()"
                 class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold text-slate-700 hover:bg-slate-50 transition">
                <svg class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
                <span>Family Profiles</span>
              </a>
              <a routerLink="/patient/history" 
                 (click)="closeDropdown()"
                 class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold text-slate-700 hover:bg-slate-50 transition">
                <svg class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                <span>Medical Records</span>
              </a>
              <div class="my-1 border-t border-slate-100"></div>
              <button (click)="logout()"
                      class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-bold text-rose-600 hover:bg-rose-50 transition cursor-pointer">
                <svg class="w-4 h-4 text-rose-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                <span>Sign Out</span>
              </button>
            </div>
          </div>
        }
      </div>
    </div>
  </header>

  <!-- Main View Container: Expanded to max-w-6xl with Mobile Bottom-Nav Padding -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 lg:p-8 pb-24 md:pb-8">
    <router-outlet></router-outlet>
  </main>

  <!-- Mobile Sticky Bottom Navigation Bar (Thumb Zone) -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 z-50 bg-white/95 backdrop-blur-md border-t border-slate-200/90 shadow-lg px-2 py-2 flex items-center justify-around text-[10px] font-bold text-slate-500">
    <a routerLink="/patient" 
       routerLinkActive="text-teal-700 font-extrabold" 
       [routerLinkActiveOptions]="{ exact: true }"
       class="flex-1 py-1 flex flex-col items-center gap-1 transition group">
      <div class="w-8 h-8 rounded-xl flex items-center justify-center transition group-[.text-teal-700]:bg-teal-50 group-[.text-teal-700]:text-teal-700">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z" />
        </svg>
      </div>
      <span>Tokens</span>
    </a>
    <a routerLink="/patient/book" 
       routerLinkActive="text-teal-700 font-extrabold" 
       class="flex-1 py-1 flex flex-col items-center gap-1 transition group">
      <div class="w-8 h-8 rounded-xl flex items-center justify-center transition group-[.text-teal-700]:bg-teal-50 group-[.text-teal-700]:text-teal-700">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
      </div>
      <span>Book</span>
    </a>
    <a routerLink="/patient/family" 
       routerLinkActive="text-teal-700 font-extrabold" 
       class="flex-1 py-1 flex flex-col items-center gap-1 transition group">
      <div class="w-8 h-8 rounded-xl flex items-center justify-center transition group-[.text-teal-700]:bg-teal-50 group-[.text-teal-700]:text-teal-700">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
        </svg>
      </div>
      <span>Family</span>
    </a>
    <a routerLink="/patient/history" 
       routerLinkActive="text-teal-700 font-extrabold" 
       class="flex-1 py-1 flex flex-col items-center gap-1 transition group">
      <div class="w-8 h-8 rounded-xl flex items-center justify-center transition group-[.text-teal-700]:bg-teal-50 group-[.text-teal-700]:text-teal-700">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
      </div>
      <span>History</span>
    </a>
  </nav>
</div>
