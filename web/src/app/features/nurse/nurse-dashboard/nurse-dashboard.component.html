<div class="min-h-screen bg-slate-100 flex flex-col font-sans">
  <!-- Nurse Topbar -->
  <header class="bg-white border-b border-slate-200 px-8 py-4 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-3.5">
      <div class="w-10 h-10 rounded-2xl bg-purple-600 text-white flex items-center justify-center font-bold text-lg shadow-md shadow-purple-600/20">👩‍⚕️</div>
      <div>
        <h1 class="text-base font-bold text-slate-800">{{ auth.currentUser()?.fullName || 'Nurse' }}</h1>
        <p class="text-xs text-slate-500">Nursing Station · Vitals & Triage Assessment</p>
      </div>
    </div>
    <div class="flex items-center gap-4">
      <select class="text-xs font-semibold px-3.5 py-2 rounded-xl border border-slate-200 bg-white shadow-sm">
        <option>Station: Desk A - Cardiology (Floor 1)</option>
        <option>Station: Desk B - Orthopedics (Floor 2)</option>
      </select>
      <button (click)="logout()" class="text-xs font-bold text-slate-600 hover:text-red-600 border border-slate-200 px-3.5 py-1.5 rounded-xl transition">
        Logout
      </button>
    </div>
  </header>

  <!-- Main Layout -->
  <main class="flex-1 p-8 max-w-5xl mx-auto w-full space-y-6">
    <!-- Patient Lookup Bar & Walk-in -->
    <div class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm flex items-center justify-between gap-6">
      <div class="flex-1">
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Look up arriving patient</label>
        <div class="flex gap-2.5">
          <input type="text" placeholder="Enter Token Number (e.g. CARD-104) or Phone Number..." 
                 class="flex-1 px-4 py-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-purple-500 bg-white">
          <button class="px-5 py-2.5 bg-purple-600 hover:bg-purple-700 text-white rounded-xl text-sm font-bold shadow-md shadow-purple-600/20 transition">
            Search
          </button>
        </div>
      </div>
      <div class="border-l border-slate-100 pl-6">
        <button class="px-5 py-2.5 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-sm font-bold shadow-md shadow-amber-500/20 transition whitespace-nowrap">
          + Emergency Walk-In
        </button>
      </div>
    </div>

    <!-- Vitals Entry Form Placeholder -->
    <div class="bg-white rounded-3xl border border-slate-200 p-7 shadow-sm">
      <div class="flex items-center justify-between mb-5 border-b border-slate-100 pb-4">
        <div>
          <h3 class="text-base font-bold text-slate-800">Clinical Vitals & Urgency Evaluation</h3>
          <p class="text-xs text-slate-400">Cardiology intake for Token <span class="font-mono font-bold text-slate-700">CARD-104</span></p>
        </div>
        <span class="px-3.5 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-700 border border-amber-200">
          Auto-Calculated Level: Yellow (Urgent)
        </span>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Oxygen Saturation (SpO2 %)</label>
          <input type="number" value="94" class="w-full px-3.5 py-2 border rounded-xl text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Blood Pressure (Sys / Dia)</label>
          <div class="flex gap-2">
            <input type="number" value="135" placeholder="Sys" class="w-1/2 px-3 py-2 border rounded-xl text-sm">
            <input type="number" value="88" placeholder="Dia" class="w-1/2 px-3 py-2 border rounded-xl text-sm">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Heart Rate (BPM)</label>
          <input type="number" value="82" class="w-full px-3.5 py-2 border rounded-xl text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Temperature (°F)</label>
          <input type="number" value="98.7" class="w-full px-3.5 py-2 border rounded-xl text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Pain Scale (0–10)</label>
          <input type="number" value="7" min="0" max="10" class="w-full px-3.5 py-2 border rounded-xl text-sm">
        </div>
      </div>

      <div class="mt-4">
        <label class="block text-xs font-semibold text-slate-600 mb-1">Nurse Observation Notes</label>
        <textarea rows="2" placeholder="Patient appears in moderate distress..." class="w-full px-3.5 py-2 border rounded-xl text-sm"></textarea>
      </div>

      <div class="mt-7 flex justify-end">
        <button class="px-6 py-2.5 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl text-sm shadow-md shadow-purple-600/20 transition">
          Submit Triage & Activate into Queue &rarr;
        </button>
      </div>
    </div>
  </main>
</div>
