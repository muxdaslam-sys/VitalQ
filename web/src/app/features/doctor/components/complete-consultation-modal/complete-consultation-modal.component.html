<div teleportToBody class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fadeIn">
  <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 space-y-4">
    
    <!-- Modal Header -->
    <div class="flex items-center justify-between pb-3 border-b border-slate-100">
      <div>
        <h3 class="text-base font-bold text-slate-800">Finalize Consultation</h3>
        <p class="text-xs text-slate-500">Record diagnosis, clinical notes, and discharge patient</p>
      </div>
      <button (click)="close.emit()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg transition cursor-pointer" title="Close">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Patient Brief Info -->
    <div class="p-3.5 bg-slate-50 rounded-2xl flex items-center justify-between text-xs border border-slate-100">
      <div>
        <span class="font-mono font-bold text-slate-900">{{ currentCalled.tokenNumber }}</span>
        <span class="text-slate-700 ml-2 font-medium">{{ currentCalled.patientName }}</span>
      </div>
      <div class="flex items-center gap-1.5 text-teal-700 font-mono font-bold bg-teal-50 px-2 py-0.5 rounded-lg border border-teal-200">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>{{ consultationTimerText }}</span>
      </div>
    </div>

    <!-- Clinical Notes Input -->
    <div class="space-y-1.5">
      <label class="block text-xs font-bold text-slate-700">Clinical Observations &amp; Prescription / Advice</label>
      <textarea 
        [ngModel]="consultationNotes()"
        (ngModelChange)="consultationNotes.set($event)"
        rows="4"
        placeholder="Enter clinical impression, prescribed medications, follow-up instructions..."
        class="w-full text-xs rounded-2xl border border-slate-200 p-3.5 focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition resize-none"></textarea>
    </div>

    <!-- Action Buttons -->
    <div class="flex items-center justify-end gap-3 pt-2">
      <button 
        type="button"
        (click)="close.emit()"
        [disabled]="isSubmitting()"
        class="px-4 py-2.5 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition cursor-pointer">
        Cancel
      </button>
      <button 
        type="button"
        (click)="onSubmit()"
        [disabled]="isSubmitting()"
        class="px-5 py-2.5 rounded-xl text-xs font-bold bg-teal-600 hover:bg-teal-700 text-white shadow-md shadow-teal-600/20 transition flex items-center gap-2 cursor-pointer">
        @if (isSubmitting()) {
          <span class="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
          <span>Finalizing...</span>
        } @else {
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
          <span>Conclude &amp; Release Chamber</span>
        }
      </button>
    </div>

  </div>
</div>
